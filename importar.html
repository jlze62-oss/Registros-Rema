window.addEventListener('load', () => {
  const preview = document.getElementById('preview');
  preview.innerHTML = COUPLES.map((c, i) => {
    const paid = c.payments.reduce((s,p) => s+p.amount, 0);
    return '<div class="preview-item">' +
      '<div class="couple-name">' + (i+1) + '. ' + (c.him||'—') + ' & ' + (c.her||'—') + '</div>' +
      '<div class="couple-meta">' + (c.regDate||'') + ' · ' + c.payments.length + ' abono(s) · $' + paid.toLocaleString('es-MX') + (c.telHim ? ' · ' + c.telHim : '') + '</div>' +
    '</div>';
  }).join('');
});

function startImport() {
  const btn = document.getElementById('btn-import');
  btn.disabled = true;
  btn.textContent = 'Importando...';
  document.getElementById('progress-section').style.display = 'block';

  let existing = JSON.parse(localStorage.getItem('rm_couples') || '[]');
  let added = 0, skipped = 0;
  const total = COUPLES.length;

  COUPLES.forEach((c, i) => {
    setTimeout(() => {
      const nameMatch = existing.find(e =>
        e.him && c.him &&
        e.him.toLowerCase().trim() === c.him.toLowerCase().trim() &&
        e.her && c.her &&
        e.her.toLowerCase().trim() === c.her.toLowerCase().trim()
      );

      if (!nameMatch) {
        existing.push(c);
        added++;
      } else {
        skipped++;
      }

      const pct = Math.round((i+1)/total*100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('status-text').textContent = 'Procesando ' + (i+1) + ' de ' + total + '...';

      if (i === total - 1) {
        localStorage.setItem('rm_couples', JSON.stringify(existing));
        document.getElementById('success-msg').style.display = 'block';
        document.getElementById('success-detail').textContent =
          added + ' parejas agregadas · ' + skipped + ' ya existían';
        btn.textContent = '✓ Completado';
        document.getElementById('status-text').textContent = '¡Listo! Ya puedes ir a la app.';
      }
    }, i * 15);
  });
}
